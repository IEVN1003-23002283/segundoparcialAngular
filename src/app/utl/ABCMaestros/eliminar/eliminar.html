
<div class="w-full rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">

  <h1 class="mb-6 text-2xl font-bold text-gray-900 dark:text-white">
    Eliminar Maestro
  </h1>

  <div *ngIf="maestro">

    <p class="mb-4 text-gray-700 dark:text-gray-300">
      ¿Estás seguro de que deseas eliminar este maestro?
    </p>

    <div class="mb-6 rounded-lg bg-gray-50 p-4 dark:bg-gray-700">

      <p class="mb-2 dark:text-white">
        <strong>ID:</strong> {{maestro.idmaestro}}
      </p>

      <p class="mb-2 dark:text-white">
        <strong>Nombre:</strong> {{maestro.nombre}}
      </p>

      <p class="mb-2 dark:text-white">
        <strong>Apellido Paterno:</strong> {{maestro.apaterno}}
      </p>

      <p class="mb-2 dark:text-white">
        <strong>Apellido Materno:</strong> {{maestro.amaterno}}
      </p>

      <p class="dark:text-white">
        <strong>Correo:</strong> {{maestro.correo}}
      </p>

    </div>

    <div class="flex gap-3">

      <button
        type="button"
        (click)="eliminarMaestro()"
        class="rounded-lg bg-red-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-red-800">
        Confirmar eliminación
      </button>

      <a
        routerLink="/maestros"
        class="rounded-lg bg-gray-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-gray-600">
        Cancelar
      </a>

    </div>

  </div>

  <p class="mt-4 text-red-600">{{mensaje}}</p>

</div>
