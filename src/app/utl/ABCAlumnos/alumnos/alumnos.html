
<div class="w-full rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800">

  <!-- Encabezado -->
  <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-700">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
      Lista de Alumnos
    </h1>
  </div>

  <!-- Contenido -->
  <div class="p-6">

    <!-- Filtro -->
    <div class="mb-4 grid grid-cols-1 gap-4 md:grid-cols-6">

      <label for="filtro" class="text-sm font-medium text-gray-900 dark:text-white md:col-span-2">
        Filtrar por:
      </label>

      <div class="md:col-span-4">
        <input
          id="filtro"
          [(ngModel)]="listFilter"
          type="text"
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
          placeholder="Ingrese nombre del alumno"
        />
      </div>

    </div>

    <!-- Texto del filtro -->
    <div class="mb-4">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
        Filtro: {{listFilter}}
      </h3>
    </div>

    <!-- Tabla -->
    <div class="relative overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">

      <table
        *ngIf="dataSource.length > 0"
        class="w-full text-left text-sm text-gray-500 dark:text-gray-400"
      >
        <thead class="bg-gray-50 text-xs uppercase text-gray-700 dark:bg-gray-700 dark:text-gray-400">
          <tr>
            <th scope="col" class="px-6 py-3">Matricula</th>
            <th scope="col" class="px-6 py-3">Nombre</th>
            <th scope="col" class="px-6 py-3">Apaterno</th>
            <th scope="col" class="px-6 py-3">Amaterno</th>
            <th scope="col" class="px-6 py-3">Correo</th>
            <th scope="col" class="px-6 py-3">Editar</th>
            <th scope="col" class="px-6 py-3">Eliminar</th>
          </tr>
        </thead>

        <tbody>
          <tr
            class="bg-gray-50"
            *ngFor="let alumno of dataSource | alumnoFilter:listFilter">

            <td class="px-6 py-4">{{alumno.matricula}}</td>
            <td class="px-6 py-4">{{alumno.nombre | uppercase}}</td>
            <td class="px-6 py-4">{{alumno.apaterno}}</td>
            <td class="px-6 py-4">{{alumno.amaterno}}</td>
            <td class="px-6 py-4">{{alumno.correo}}</td>
            <td class="px-6 py-4"></td>
            <td class="px-6 py-4"></td>

          </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>
